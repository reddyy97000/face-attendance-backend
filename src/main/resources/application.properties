server.port=${PORT:8081}

# ---- Database (env-var driven, dev defaults) ----
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/attendance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Face images are sent as base64 – allow large bodies
spring.servlet.multipart.max-file-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Recognition threshold (0..1, higher = stricter)
face.match.threshold=${FACE_THRESHOLD:0.70}

# Frontend origin for CORS (comma-separated, NO wildcards in production!)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://ss-agency-attendence.vercel.app}

# API key for securing /api/** endpoints (blank = disabled, for local dev)
app.api-key=${API_KEY:}

# Actuator — expose only health + info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

