# Production profile — activate with: SPRING_PROFILES_ACTIVE=prod
# Overrides dev-friendly defaults in application.properties.

# Schema must be managed externally (Flyway / Liquibase / manual DDL).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Hide stack-traces from API consumers
server.error.include-stacktrace=never
server.error.include-message=never
